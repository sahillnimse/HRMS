services:
  - type: web
    name: hrms-ai-backend
    env: docker
    plan: standard
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-ai-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: hrms-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
    autoDeploy: true

databases:
  - name: hrms-ai-db
    plan: starter
    region: oregon
