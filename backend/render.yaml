services:
  - type: web
    name: hrms-ai-backend
    env: docker
    plan: standard
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-ai-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: hrms-ai-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: hrms-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: ENABLE_CANDIDATE_BRIEF
        value: "true"
      - key: TIMELINE_GAP_THRESHOLD_MONTHS
        value: "3"
      - key: STORAGE_BACKEND
        value: r2
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PREFIX
        value: resumes
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
    autoDeploy: true

databases:
  - name: hrms-ai-db
    plan: starter
    region: oregon
