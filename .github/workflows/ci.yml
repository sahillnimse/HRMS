name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Migrations & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms_user
          POSTGRES_PASSWORD: hrms_pass
          POSTGRES_DB: hrms_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hrms_user -d hrms_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://hrms_user:hrms_pass@127.0.0.1:5432/hrms_test_db
      DATABASE_URL_UNPOOLED: postgresql://hrms_user:hrms_pass@127.0.0.1:5432/hrms_test_db
      DATABASE_URL_SYNC: postgresql+psycopg2://hrms_user:hrms_pass@127.0.0.1:5432/hrms_test_db
      SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long-0123456789
      ENABLE_CLEANUP_SCHEDULER: "false"
      STORAGE_BACKEND: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run pytest suite
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vite production build
        working-directory: frontend
        run: npm run build
